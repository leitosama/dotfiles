name: Dependabot auto-merge

# Auto-merges Dependabot PRs for patch/minor bumps once the lint check is
# green; majors are left for review.
#
# pull_request_target, not pull_request: a Dependabot `pull_request` run gets a
# read-only GITHUB_TOKEN, so `gh pr merge` would fail. Safe here because no PR
# code is ever checked out or executed. Do not add a checkout step.
#
# `--auto` only waits for CI if the Lint check is required in the branch
# protection / ruleset of `main` (and "Allow auto-merge" is on); without that
# it merges immediately.

on: pull_request_target # zizmor: ignore[dangerous-triggers]

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for patch/minor bumps
        if: |
          contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.metadata.outputs.update-type)
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
