name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ansible:
    runs-on: ubuntu-latest
    env:
      # The future default (ansible-core 2.24): top-level facts like ansible_env
      # are not injected, so playbooks must use ansible_facts[...]
      ANSIBLE_INJECT_FACTS_AS_VARS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ansible and ansible-lint
        run: pip install -r requirements.txt

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax check
        run: ansible-playbook -i localhost, --syntax-check cli.yaml gui.yaml

