- name: Dotfiles
  hosts: all
  tasks:
    - name: Install zsh
      become: "{{ 'false' if ansible_facts['os_family'] == 'Darwin' else 'true' }}"
      ansible.builtin.package:
        name:
          # - ttf-hack-nerd
          - zsh
          - git
          - vim

    - name: Fetch starship
      ansible.builtin.uri:
        url: https://starship.rs/install.sh
        return_content: true
      register: starship_installer

    - name: Run starship installer
      become: true
      ansible.builtin.command:
        cmd: "sh -s -- -y"
        stdin: "{{ starship_installer.content }}"
        creates: /usr/local/bin/starship

    - name: Install X11/Wayland packages
      tags:
        - kde
      become: true
      ansible.builtin.package:
        name:
          - xclip
          - xsel
          - wl-clipboard
        state: present

    - name: Get the username running the deploy
      become: false
      changed_when: false
      ansible.builtin.command: whoami
      register: whoami

    - name: Change default shell
      become: true
      ansible.builtin.user:
        name: "{{ whoami.stdout }}"
        shell: "/bin/zsh"
        state: present

    - name: Install antigen
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/zsh-users/antigen/8846aa9/bin/antigen.zsh
        dest: ~/.antigen.zsh
        mode: '0660'

    - name: Configure starship
      ansible.builtin.copy:
        src: ./config/starship.toml
        dest: ~/.config/
        mode: '0600'

    - name: Configure antigen
      ansible.builtin.copy:
        src: ./config/.antigenrc
        dest: ~/.config/
        mode: '0600'

    - name: Configure zshrc
      ansible.builtin.copy:
        src: ./config/.zshrc
        dest: ~/
        mode: '0600'
        backup: true

